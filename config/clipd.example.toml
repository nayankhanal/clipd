# Copy to ~/.config/clipd/config.toml
# Missing file / missing keys / unparseable values all fall back to
# the defaults shown below — nothing here is required.

[detectors]
json = true
stack_trace = true
code = true

[cleaners]
# Smart-quote/invisible-char/trailing-whitespace normalization always
# runs — it's non-destructive, so there's no toggle for it. Only
# indentation rewriting (which is more opinionated) is configurable:
fix_indentation = true
spaces_per_tab = 4
